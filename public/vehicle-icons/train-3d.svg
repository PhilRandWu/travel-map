    <ellipse cx="115" cy="58" rx="3.2" ry="2.2" fill="#FFF4B6" filter="url(#train-light)"/>
    <path d="M13 52c2-6 9-11 19-13" fill="none" stroke="#F6FBFD" stroke-opacity=".72" stroke-width="2" stroke-linecap="round"/>
