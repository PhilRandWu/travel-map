<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="train-body" x1="17" y1="29" x2="106" y2="84" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset=".3" stop-color="#F2F7FA"/>
      <stop offset=".66" stop-color="#CBD7DE"/>
      <stop offset="1" stop-color="#81949F"/>
    </linearGradient>
    <linearGradient id="train-skirt" x1="21" y1="66" x2="111" y2="82" gradientUnits="userSpaceOnUse">
      <stop stop-color="#344B59"/>
      <stop offset=".56" stop-color="#1E303B"/>
      <stop offset="1" stop-color="#0C1820"/>
    </linearGradient>
    <linearGradient id="train-gold" x1="19" y1="61" x2="117" y2="72" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFE69A"/>
      <stop offset=".46" stop-color="#F6B948"/>
      <stop offset="1" stop-color="#B87518"/>
    </linearGradient>
    <linearGradient id="train-glass" x1="95" y1="33" x2="118" y2="57" gradientUnits="userSpaceOnUse">
      <stop stop-color="#66D9ED"/>
      <stop offset=".32" stop-color="#1B6D8B"/>
      <stop offset="1" stop-color="#071C2B"/>
    </linearGradient>
    <linearGradient id="train-window" x1="30" y1="37" x2="30" y2="53" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4DC0D9"/>
      <stop offset=".35" stop-color="#15516B"/>
      <stop offset="1" stop-color="#071C2A"/>
    </linearGradient>
    <linearGradient id="train-rail" x1="17" y1="94" x2="114" y2="103" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5C7380"/>
      <stop offset=".54" stop-color="#C4D1D7"/>
      <stop offset="1" stop-color="#657985"/>
    </linearGradient>
    <filter id="train-shadow" x="-30%" y="-22%" width="160%" height="165%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset dy="5" result="offset"/>
      <feColorMatrix in="offset" type="matrix" values="0 0 0 0 0.01 0 0 0 0 0.05 0 0 0 0 0.08 0 0 0 .5 0" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="train-light" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.3" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

