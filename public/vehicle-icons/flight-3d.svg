    <path d="M56 47c4-6 15-7 21-1l-3 6H58Z" fill="url(#flight-engine)" stroke="#DDF5FF" stroke-opacity=".58"/>
    <path d="M56 81c4 6 15 7 21 1l-3-6H58Z" fill="#4B7EA7" stroke="#A8CEE6" stroke-opacity=".45"/>
    <circle cx="69" cy="49" r="3.4" fill="#163F61" stroke="#A7E9FF" stroke-opacity=".6"/>
    <circle cx="69" cy="79" r="3.4" fill="#173E5E" stroke="#86B9D9" stroke-opacity=".45"/>

    <path d="m15 61 7 3-7 3" fill="#1E6D9A" opacity=".72"/>
    <circle cx="119" cy="64" r="2.1" fill="#D7FBFF" filter="url(#flight-glow)"/>
