<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="car-body" x1="20" y1="52" x2="108" y2="84" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F0FFF5"/>
      <stop offset=".28" stop-color="#BBF7D0"/>
      <stop offset=".68" stop-color="#86EFAC"/>
      <stop offset="1" stop-color="#4ADE80"/>
    </linearGradient>
    <linearGradient id="car-deep" x1="25" y1="72" x2="107" y2="94" gradientUnits="userSpaceOnUse">
      <stop stop-color="#15803D"/>
      <stop offset=".58" stop-color="#166534"/>
      <stop offset="1" stop-color="#052E16"/>
    </linearGradient>
    <linearGradient id="car-glass" x1="52" y1="34" x2="93" y2="61" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E7FFFF"/>
      <stop offset=".36" stop-color="#5EEAD4"/>
      <stop offset=".76" stop-color="#0F766E"/>
      <stop offset="1" stop-color="#062C32"/>
    </linearGradient>
    <linearGradient id="car-roof" x1="43" y1="37" x2="86" y2="50" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset=".6" stop-color="#DCFCE7"/>
      <stop offset="1" stop-color="#86EFAC"/>
    </linearGradient>
    <linearGradient id="car-tire" x1="30" y1="78" x2="102" y2="101" gradientUnits="userSpaceOnUse">
      <stop stop-color="#334155"/>
      <stop offset=".55" stop-color="#111827"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <filter id="car-shadow" x="-30%" y="-22%" width="160%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset dy="5" result="offset"/>
      <feColorMatrix in="offset" type="matrix" values="0 0 0 0 0.01 0 0 0 0 0.05 0 0 0 0 0.04 0 0 0 .52 0" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="car-light" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.2" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#car-shadow)">
    <path d="M26 59 43 37c3-4 7-6 12-6h27c9 0 16 4 22 12l14 18Z" fill="url(#car-roof)" stroke="#2F7A4A" stroke-opacity=".7" stroke-width="1.1"/>
    <path d="M18 61c5-8 13-12 23-12h69c8 0 14 4 18 12l5 14c1 4-2 7-6 7H22c-5 0-8-3-8-8l4-13Z" fill="url(#car-body)" stroke="#287A49" stroke-opacity=".76" stroke-width="1.2"/>
    <path d="M24 57c21-5 55-5 82-1 8 1 15 4 21 9-14 1-29 1-44 0-25-2-44-1-63 1-3 0-4-6 4-9Z" fill="#FFFFFF" fill-opacity=".46"/>

    <path d="M48 39h18c2 0 4 2 4 4v13H42l6-17Z" fill="url(#car-glass)" stroke="#B8FFF2" stroke-opacity=".52" stroke-width=".9"/>
    <path d="M76 39h7c8 0 14 3 19 9l6 8H76V39Z" fill="url(#car-glass)" stroke="#B8FFF2" stroke-opacity=".52" stroke-width=".9"/>
    <path d="M51 42h12l-4 11h-9l3-11ZM79 42h4c6 0 10 2 15 7l4 4H79V42Z" fill="#D8FFF9" fill-opacity=".3"/>

    <path d="M16 69h99l5 9-6 3H19c-5 0-8-4-7-8l4-4Z" fill="url(#car-deep)" stroke="#1B4B2D" stroke-opacity=".6"/>
    <path d="M22 69h85" stroke="#BBF7D0" stroke-opacity=".72" stroke-width="1.1"/>

    <g fill="url(#car-tire)" stroke="#64748B" stroke-width="1.1">
