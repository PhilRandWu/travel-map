    <path d="M46 80h42" stroke="#0F172A" stroke-opacity=".5" stroke-width="3" stroke-linecap="round"/>
    <path d="M109 67c6 1 10 3 12 5l-6 3h-8l2-8Z" fill="#ECFDF5" stroke="#86EFAC" stroke-opacity=".7"/>
    <circle cx="119" cy="69" r="2.6" fill="#FFF7C2" filter="url(#car-light)"/>
    <path d="M21 59c4-5 10-8 19-10" fill="none" stroke="#F7FFF9" stroke-opacity=".8" stroke-width="2" stroke-linecap="round"/>
